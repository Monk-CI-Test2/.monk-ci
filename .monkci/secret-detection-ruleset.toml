# Org-wide policy. Mounted as the .monk-ci checkout, not part of the scanned repo.
[[secrets.ruleset]]
  disable = true
  identifier = { type = "monkci_rule_id", value = "aws-access-token" }

[[secrets.ruleset]]
  disable = true
  identifier = { type = "monkci_rule_id", value = "gitlab-pat" }

[[secrets.ruleset]]
  identifier = { type = "monkci_rule_id", value = "stripe-access-token" }
  override   = { severity = "Low" }

[[secrets.passthrough]]
  type   = "raw"
  target = "monkci-secrets.toml"
  value  = """
[extend]
  path = "/monkci-secrets.toml"

[[rules]]
  id          = "HIMANSHU_GYBE"
  title       = "Himanshu Gybe token"
  description = "Detects the literal HIMANSHU_GYBE! token"
  remediation = "Rotate the token and store it in the org secret store"
  severity    = "High"
  regex       = '''HIMANSHU_GYBE!'''
  keywords    = ["himanshu_gybe"]

[[rules]]
  id          = "akshit-persoal-rule"
  title       = "Akshit personal token"
  description = "Detects the literal AKSHIT-GYBE! token"
  remediation = "Rotate the token and store it in the org secret store"
  severity    = "High"
  regex       = '''AKSHIT-GYBE!'''
  keywords    = ["akshit-gybe"]
"""
